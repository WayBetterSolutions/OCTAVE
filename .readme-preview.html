<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>README preview - OCTAVE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-light.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  body { margin: 0; background: #f6f8fa; }
  .markdown-body {
    box-sizing: border-box;
    max-width: 980px;
    margin: 0 auto;
    padding: 45px;
    background: #ffffff;
    border: 1px solid #d0d7de;
    border-radius: 6px;
  }
  @media (max-width: 767px) {
    .markdown-body { padding: 15px; }
  }
</style>
</head>
<body>
<article id="content" class="markdown-body">Loading README.md...</article>
<script>
fetch('README.md')
  .then(r => r.text())
  .then(md => {
    document.getElementById('content').innerHTML = marked.parse(md);
  })
  .catch(e => {
    document.getElementById('content').textContent = 'Error loading README: ' + e;
  });
</script>
</body>
</html>
